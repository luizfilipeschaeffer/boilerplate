services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: boilerplate
      POSTGRES_PASSWORD: boilerplate
      POSTGRES_DB: boilerplate
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boilerplate"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  web:
    build:
      context: ../..
      dockerfile: infra/self-hosted/Dockerfile.web
    env_file: .env
    environment:
      DEPLOYMENT_MODE: self_hosted
      AUTH_MODE: central
      DATABASE_URL: postgresql://boilerplate:boilerplate@postgres:5432/boilerplate
      REDIS_URL: redis://redis:6379
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      license-agent:
        condition: service_started

  worker:
    build:
      context: ../..
      dockerfile: infra/self-hosted/Dockerfile.worker
    env_file: .env
    environment:
      DEPLOYMENT_MODE: self_hosted
      DATABASE_URL: postgresql://boilerplate:boilerplate@postgres:5432/boilerplate
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy

  license-agent:
    build:
      context: ../..
      dockerfile: infra/self-hosted/Dockerfile.license-agent
    env_file: .env
    environment:
      DEPLOYMENT_MODE: self_hosted
      DATABASE_URL: postgresql://boilerplate:boilerplate@postgres:5432/boilerplate
      CENTRAL_API_URL: ${CENTRAL_API_URL:-http://host.docker.internal:3002}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:

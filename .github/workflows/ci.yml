name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://boilerplate:boilerplate@localhost:5432/boilerplate
  AUTH_SECRET: ci-only-secret-do-not-use-in-production
  NEXT_PUBLIC_APP_URL: http://localhost:3000

jobs:
  quality:
    name: Lint, validate e build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: boilerplate
          POSTGRES_PASSWORD: boilerplate
          POSTGRES_DB: boilerplate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U boilerplate -d boilerplate"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Environment file (apps com --env-file)
        run: |
          cat > .env <<'EOF'
          DATABASE_URL=postgresql://boilerplate:boilerplate@localhost:5432/boilerplate
          AUTH_SECRET=ci-only-secret-do-not-use-in-production
          EOF

      - name: Generate Prisma Client
        run: bun run db:generate

      - name: Validate Prisma schema
        run: bun run db:validate

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build
